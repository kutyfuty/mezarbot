<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1280px;height:360px;overflow:hidden;font-family:"Noto Sans","DejaVu Sans","Noto Color Emoji",sans-serif;
  background:radial-gradient(900px 420px at 18% 30%,rgba(29,185,84,.28),transparent 60%),
             radial-gradient(700px 380px at 92% 85%,rgba(88,101,242,.35),transparent 60%),
             linear-gradient(135deg,#111214,#1e1f22 55%,#232428);color:#f2f3f5}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:48px;padding:0 70px}
.logo{width:190px;height:190px;border-radius:48px;background:linear-gradient(145deg,#1f6f4a,#0f3d29);display:flex;align-items:center;justify-content:center;font-size:118px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);flex:none}
h1{margin:0;font-size:92px;line-height:1;font-weight:800;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,#57f287,#5865f2);-webkit-background-clip:text;color:transparent}
p{margin:16px 0 26px;font-size:27px;color:#b5bac1}
.chips{display:flex;gap:10px;flex-wrap:nowrap}
.chip{padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:18px;color:#dbdee1;white-space:nowrap}
</style></head><body><div class="grid"></div><div class="wrap"><div class="logo">🪦</div><div>
<h1>Mezar<span>Bot</span></h1>
<p>Self-hosted Discord bot · Kendi sunucunda çalışan Discord botu</p>
<div class="chips"><span class="chip">🎵 Music</span><span class="chip">🔊 Private rooms</span><span class="chip">🛡️ Moderation</span><span class="chip">📊 Voice stats</span><span class="chip">🤖 AI</span><span class="chip">🌐 TR / EN</span></div>
</div></div></body></html>
